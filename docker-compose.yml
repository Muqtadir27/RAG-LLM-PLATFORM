version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - UPLOAD_DIR=/app/uploads
      - CHROMA_DIR=/app/database/chroma
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - uploads:/app/uploads
      - chroma:/app/database/chroma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  uploads:
  chroma: